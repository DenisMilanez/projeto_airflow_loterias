name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loterias
          POSTGRES_PASSWORD: loterias
          POSTGRES_DB: loterias
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U loterias"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LOTERIAS_DB_PERFIL: local
      LOTERIAS_DB_HOST: localhost
      LOTERIAS_DB_PORT: "5433"
      LOTERIAS_DB_NOME: loterias
      LOTERIAS_DB_USUARIO: loterias
      LOTERIAS_DB_SENHA: loterias

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar o pacote
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check loterias tests airflow

      - name: Ruff (formatacao)
        run: ruff format --check loterias tests airflow

      - name: Criar schema no Postgres de teste
        run: |
          python -m loterias.schema.publico
          python -m loterias.schema.observabilidade
          loterias-admin db views-aplicar

      - name: Testes
        run: pytest -q

  dags:
    name: Import das DAGs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar Airflow e o pacote
        run: |
          pip install "apache-airflow==2.9.2" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.2/constraints-3.11.txt"
          pip install -e .

      - name: Carregar as DAGs e falhar se alguma quebrar
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: python scripts/checar_dags.py
