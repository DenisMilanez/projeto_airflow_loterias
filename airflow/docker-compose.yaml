name: loterias

x-airflow-comum: &airflow-comum
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    LOTERIAS_HOME: /opt/loterias
    LOTERIAS_DB_PERFIL: local
    LOTERIAS_DB_HOST: postgres-loterias
    LOTERIAS_DB_PORT: "5432"
    LOTERIAS_DB_NOME: loterias
    LOTERIAS_DB_USUARIO: loterias
    LOTERIAS_DB_SENHA: loterias
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ..:/opt/loterias
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres-airflow:
      condition: service_healthy
    postgres-loterias:
      condition: service_healthy

services:
  postgres-airflow:
    image: postgres:16-alpine
    container_name: loterias_airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  postgres-loterias:
    image: postgres:16-alpine
    container_name: loterias_postgres
    environment:
      POSTGRES_USER: loterias
      POSTGRES_PASSWORD: loterias
      POSTGRES_DB: loterias
    ports:
      - "5433:5432"
    volumes:
      - loterias-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "loterias"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-comum
    container_name: loterias_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname admin --lastname admin \
          --role Admin --email admin@example.com || true
    restart: "no"

  scheduler:
    <<: *airflow-comum
    container_name: loterias_airflow_scheduler
    command: scheduler
    restart: unless-stopped

  webserver:
    <<: *airflow-comum
    container_name: loterias_airflow_webserver
    command: webserver
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  airflow-metadata:
  loterias-dados:

networks:
  default:
    name: loterias
