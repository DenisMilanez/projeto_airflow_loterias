name: loterias_metabase

services:
  postgres-metabase:
    image: postgres:16-alpine
    container_name: loterias_metabase_postgres
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
      POSTGRES_DB: metabaseapp
    volumes:
      - metabase-metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "metabase"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: loterias_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseapp
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: postgres-metabase
    depends_on:
      postgres-metabase:
        condition: service_healthy
    networks:
      - default
      - loterias
    restart: unless-stopped

volumes:
  metabase-metadata:

networks:
  loterias:
    external: true
