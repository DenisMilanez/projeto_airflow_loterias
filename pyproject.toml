[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loterias"
version = "0.1.0"
description = "Pipeline de dados das loterias da Caixa Economica Federal em arquitetura medallion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pandas>=2.2",
    "pandera>=0.20",
    "psycopg2-binary>=2.9",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
dbt = [
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
]

[project.scripts]
loterias-admin = "loterias.admin.cli:app"

[tool.setuptools.packages.find]
include = ["loterias*"]

[tool.setuptools.package-data]
loterias = ["sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracao: exige um PostgreSQL acessivel",
]
